/* ---------- menu engineering ---------- */
const QUAD = {
  star: {t: 'Stars', c: 'var(--c3)', tip: 'Popular and profitable. Keep them consistent and visible.'},
  horse: {t: 'Workhorses', c: 'var(--c2)', tip: 'Popular but lower margin. Try a small price rise or a cheaper recipe.'},
  puzzle: {t: 'Puzzles', c: 'var(--c4)', tip: 'Profitable but not selling much. Promote, rename or bundle them.'},
  dog: {t: 'Underdogs', c: 'var(--c5)', tip: 'Low sales and low margin. Rework, reprice or consider removing.'}
};
function menuData(r) {
  const rows = q(`SELECT i.product_id id, i.name, SUM(i.qty) q, SUM(i.total) rev, SUM(COALESCE(i.cost,0)) cost FROM order_items i JOIN orders o ON o.id=i.order_id WHERE o.status='completed' AND substr(o.ts,1,10) BETWEEN ? AND ? GROUP BY i.product_id ORDER BY q DESC`, [r.f, r.e]);
  const totQ = rows.reduce((s, x) => s + x.q, 0), totM = rows.reduce((s, x) => s + x.rev - x.cost, 0);
  const popT = rows.length ? .7 * totQ / rows.length : 0, mT = totQ ? totM / totQ : 0;
  return {rows: rows.map(x => { const um = (x.rev - x.cost) / x.q, hi = x.q >= popT, hm = um >= mT; return {...x, um, profit: x.rev - x.cost, quad: hi && hm ? 'star' : hi ? 'horse' : hm ? 'puzzle' : 'dog'}; }), popT, mT, totQ};
}
function menuView(r) {
  const {rows, popT, mT, totQ} = menuData(r);
  if (rows.length < 2) return empty('Not enough sales in this period', 'Menu engineering compares items against each other, so it needs at least two items with sales. Try a longer period.');
  regCsv('menu', 'menu-engineering', () => rows.map(x => ({name: x.name, units: x.q, unit_margin: round(x.um), total_profit: round(x.profit), group: QUAD[x.quad].t})), [['name', 'Item'], ['units', 'Units sold'], ['unit_margin', 'Profit per item'], ['total_profit', 'Total profit'], ['group', 'Group']]);
  const maxQ = Math.max(...rows.map(x => x.q)) * 1.1, lowM = Math.min(...rows.map(x => x.um)), highM = Math.max(...rows.map(x => x.um)), padM = Math.max((highM - lowM) * .18, 1), minM = Math.max(0, lowM - padM), maxM = highM + padM;
  // place labels left or right of each dot; skip a label rather than let two collide (the tooltip and lists still name every item)
  const W0 = 560, H0 = 340, placed = [], labels = {};
  [...rows].sort((a, b) => b.profit - a.profit).forEach(x => {
    const px = x.q / maxQ * W0, py = (1 - (x.um - minM) / (maxM - minM)) * H0, w = x.name.length * 6.6 + 8;
    for (const side of px > W0 * .62 ? ['l', 'r'] : ['r', 'l']) {
      const box = side === 'r' ? [px + 9, py - 8, px + 9 + w, py + 8] : [px - 9 - w, py - 8, px - 9, py + 8];
      if (box[0] < 0 || box[2] > W0) continue;
      if (placed.some(b => !(box[2] < b[0] || box[0] > b[2] || box[3] < b[1] || box[1] > b[3]))) continue;
      placed.push(box, [px - 7, py - 7, px + 7, py + 7]); labels[x.id] = side; break;
    }
  });
  const X = v => v / maxQ * 100, Y = v => 100 - (v - minM) / (maxM - minM) * 100;
  return `<div class="grid c2">
  <div class="card"><h3>Popularity vs profit per item ${csvBtn('menu', 'CSV')}</h3>
    <div class="legend">${Object.values(QUAD).map(qd => `<span><i style="background:${qd.c};border-radius:50%"></i>${qd.t}</span>`).join('')}</div>
    <div class="scatter">
      <div class="qline v" style="left:${X(popT)}%"></div><div class="qline h" style="top:${Y(mT)}%"></div>
      <span class="qlab" style="right:6px;top:4px">Stars</span><span class="qlab" style="right:6px;bottom:28px">Workhorses</span><span class="qlab" style="left:6px;top:4px">Puzzles</span><span class="qlab" style="left:6px;bottom:28px">Underdogs</span>
      ${rows.map(x => `<span class="pt" style="left:${X(x.q)}%;top:${Y(x.um)}%;--c:${QUAD[x.quad].c}" data-tip="${esc(`${x.name}: ${fq(x.q)} sold, ${peso(x.um)} profit each, ${peso(x.profit)} total (${QUAD[x.quad].t})`)}"><i></i>${labels[x.id] ? `<b class="${labels[x.id]}">${esc(x.name)}</b>` : ''}</span>`).join('')}
      <span class="ax x">Units sold →</span><span class="ax y">Profit per item →</span>
    </div>
    <p class="hint" style="margin:10px 0 0">Lines mark the menu average: popular means at least 70% of an even share (${fq(round(popT, 1))} units); profitable means above the average profit per item (${peso(mT)}). Profit is price minus ingredient cost, before discounts.</p></div>
  <div class="stack">${Object.entries(QUAD).map(([k, qd]) => { const it = rows.filter(x => x.quad === k); return `<div class="card quad"><h3><span><i class="qdot" style="background:${qd.c}"></i>${qd.t}</span><span class="small muted" style="font-family:var(--sans);font-weight:500">${it.length} item${it.length === 1 ? '' : 's'}</span></h3><p class="cap" style="margin:-6px 0 8px">${qd.tip}</p>${it.length ? `<ul class="list">${it.map(x => `<li><span>${esc(x.name)}</span><span class="small muted">${fq(x.q)} sold · ${peso(x.um)} each</span></li>`).join('')}</ul>` : '<p class="muted small" style="margin:0">None in this period.</p>'}</div>`; }).join('')}</div>
  </div>
  <div style="margin-top:16px">${cardT('All items', T([{h: 'Item', main: 1, f: x => `<b>${esc(x.name)}</b> ${chip(QUAD[x.quad].t, {star: 'ok', horse: 'warn', puzzle: 'info', dog: 'bad'}[x.quad])}`}, {h: 'Units sold', r: 1, f: x => fq(x.q)}, {h: 'Share', r: 1, f: x => pct(x.q, totQ)}, {h: 'Profit each', r: 1, f: x => peso(x.um)}, {h: 'Total profit', r: 1, f: x => peso(x.profit)}], rows), '')}</div>`;
}

async function applyPrices() {
  const ch = (S.whatIf || []).filter(x => x.changed);

  tx(() => ch.forEach(x => {
    const p = x.p, vid = insert('recipe_versions', {product_id: p.id, version: p.version + 1, price: x.newPrice, lines: JSON.stringify(p.lines), note: 'Price change from What-if', created_at: ts});

/* ---------- basket analysis ---------- */
function basketData(r) {
  const rows = q(`SELECT i.order_id o, i.name n, SUM(i.qty) q FROM order_items i JOIN orders x ON x.id=i.order_id WHERE x.status='completed' AND substr(x.ts,1,10) BETWEEN ? AND ? GROUP BY i.order_id, i.name`, [r.f, r.e]);
  const by = {}; rows.forEach(x => (by[x.o] ||= []).push(x));
  const orders = Object.values(by), N = orders.length, cnt = {}, pairs = {}, sizes = {};
  orders.forEach(o => {
    const items = [...new Set(o.map(x => x.n))].sort(), size = o.reduce((s, x) => s + x.q, 0);
    sizes[Math.min(size, 4)] = (sizes[Math.min(size, 4)] || 0) + 1;
    items.forEach(a => cnt[a] = (cnt[a] || 0) + 1);
    for (let i = 0; i < items.length; i++) for (let j = i + 1; j < items.length; j++) { const k = items[i] + '\u0000' + items[j]; pairs[k] = (pairs[k] || 0) + 1; }
  });
  const list = Object.entries(pairs).map(([k, c]) => { const [a, b] = k.split('\u0000'); return {a, b, c, sup: c / N, confAB: c / cnt[a], confBA: c / cnt[b], lift: (c / N) / ((cnt[a] / N) * (cnt[b] / N))}; });
  return {N, cnt, list, sizes, multi: orders.filter(o => new Set(o.map(x => x.n)).size > 1).length, units: rows.reduce((s, x) => s + x.q, 0)};
}
function basketView(r) {
  const B = basketData(r);
  if (B.N < 10) return empty('Not enough orders in this period', 'Basket analysis looks at which items are ordered together. Pick a longer period with at least 10 orders.');
  const top = B.list.filter(x => x.c >= 2).sort((a, b) => b.c - a.c || b.lift - a.lift).slice(0, 15);
  const items = Object.keys(B.cnt).sort((a, b) => B.cnt[b] - B.cnt[a]);
  const sel = F('bk.item', items[0]);
  const comp = B.list.filter(x => x.a === sel || x.b === sel).map(x => { const o = x.a === sel ? x.b : x.a; return {o, c: x.c, conf: x.c / B.cnt[sel], lift: x.lift}; }).sort((a, b) => b.conf - a.conf);
  const liftChip = l => l >= 1.2 ? chip('Often together', 'ok') : l >= .9 ? chip('As expected', '') : chip('Rarely together', 'warn');
  const idea = B.list.filter(x => x.sup >= .02 && x.c >= 3 && x.lift >= 1.15).sort((a, b) => b.lift - a.lift)[0];
  regCsv('pairs', 'basket-pairs', () => B.list.sort((a, b) => b.c - a.c).map(x => ({a: x.a, b: x.b, orders: x.c, share: round(x.sup * 100, 2), ab: round(x.confAB * 100, 1), ba: round(x.confBA * 100, 1), lift: round(x.lift, 2)})),
    [['a', 'Item A'], ['b', 'Item B'], ['orders', 'Orders with both'], ['share', '% of all orders'], ['ab', '% of A orders with B'], ['ba', '% of B orders with A'], ['lift', 'Lift']]);
  return `<div class="tiles">
    <div class="tile hero"><div class="k">Orders with 2+ different items</div><div class="v">${pct(B.multi, B.N)}</div><div class="d">${B.multi} of ${B.N} orders</div></div>
    <div class="tile"><div class="k">Items per order</div><div class="v">${(B.units / B.N).toFixed(2)}</div><div class="d">On average</div></div>
    <div class="tile"><div class="k">Most common pair</div><div class="v" style="font-size:17px">${top[0] ? esc(top[0].a) + ' + ' + esc(top[0].b) : '–'}</div><div class="d">${top[0] ? `${top[0].c} orders` : ''}</div></div>
    <div class="tile"><div class="k">Bundle idea</div><div class="v" style="font-size:17px">${idea ? esc(idea.a) + ' + ' + esc(idea.b) : '–'}</div><div class="d">${idea ? `Bought together ${idea.lift.toFixed(1)}× more than chance` : 'No standout pair yet'}</div></div>
  </div>
  <div class="grid c2"><div class="stack">
    ${cardT('Items ordered together', T([{h: 'Pair', main: 1, f: x => `<b>${esc(x.a)}</b> + <b>${esc(x.b)}</b>`}, {h: 'Orders', r: 1, k: 'c'}, {h: 'Of all orders', r: 1, f: x => (x.sup * 100).toFixed(1) + '%'}, {h: 'Lift', r: 1, f: x => x.lift.toFixed(2)}, {h: '', f: x => liftChip(x.lift)}], top, {empty: '<p class="muted" style="margin:0">No item appears together with another in 2 or more orders yet.</p>'}), 'pairs', 'Lift compares how often two items appear together with what you’d expect by chance. Above 1 means they’re bought together more than chance.')}
  </div><div class="stack">
    <div class="card"><h3>People who order…</h3><div class="bar-row" style="margin-bottom:10px"><label class="grow">Item<select data-f="bk.item">${opts(items, sel)}</select></label></div>
      ${comp.length ? hBars(comp.slice(0, 8).map(x => ({x: x.o, v: x.conf * 100, tip: `${x.c} of ${B.cnt[sel]} orders with ${sel} also had ${x.o} (lift ${x.lift.toFixed(2)})`})), {fmt: v => Math.round(v) + '%'}) : '<p class="muted" style="margin:0">Always ordered on its own in this period.</p>'}
      <p class="hint" style="margin:10px 0 0">Share of orders containing ${esc(sel)} that also included each item.</p></div>
    ${cardT('Order size', hBars([1, 2, 3, 4].map(k => ({x: k === 4 ? '4 or more items' : `${k} item${k === 1 ? '' : 's'}`, v: B.sizes[k] || 0, tip: `${B.sizes[k] || 0} orders (${pct(B.sizes[k] || 0, B.N)})`})), {fmt: v => fq(v)}))}
  </div></div>`;
}

/* ---------- anomaly alerts ---------- */
function stdev(a) { return a.length > 1 ? Math.sqrt(variance(a)) : 0; }
function detectAlerts(f, e) {
  const out = [], t = today(), add = (date, sev, area, title, detail, go2) => out.push({date, sev, area, title, detail, go: go2});
  const first = val(`SELECT MIN(substr(ts,1,10)) FROM orders WHERE status='completed'`);
  if (first) {
    const from = addDays(f, -28);
    const day = Object.fromEntries(q(`SELECT substr(ts,1,10) d, SUM(CASE WHEN status='completed' THEN total ELSE 0 END) s, SUM(status='completed') n, SUM(status='voided') v, SUM(CASE WHEN status='completed' THEN discount ELSE 0 END) disc, SUM(CASE WHEN status='completed' THEN cost ELSE 0 END) c FROM orders WHERE substr(ts,1,10) BETWEEN ? AND ? GROUP BY d`, [from, e]).map(x => [x.d, x]));
    const g = (d, k) => (day[d] || {})[k] || 0;

/* ---------- hour by hour: each forecast day's total, spread over the day the way that weekday usually goes ---------- */
function hourProfile(metric, id) {
  const f = addDays(today(), -56), e = addDays(today(), -1);
  const rows = metric === 'sales' ? q(`SELECT ts, total v FROM orders WHERE status='completed' AND substr(ts,1,10) BETWEEN ? AND ?`, [f, e])
    : metric === 'item' ? q(`SELECT o.ts, i.qty v FROM order_items i JOIN orders o ON o.id=i.order_id WHERE o.status='completed' AND i.product_id=? AND substr(o.ts,1,10) BETWEEN ? AND ?`, [+id, f, e])
    : q(`SELECT ts, 1 v FROM orders WHERE status='completed' AND substr(ts,1,10) BETWEEN ? AND ?`, [f, e]);   // orders; ingredient use follows when orders come in
  const by = Array.from({length: 7}, () => Array(24).fill(0)), all = Array(24).fill(0), days = Array.from({length: 7}, () => new Set());
  rows.forEach(r => { const d = r.ts.slice(0, 10), w = parseD(d).getDay(), hr = +r.ts.slice(11, 13); by[w][hr] += r.v; all[hr] += r.v; days[w].add(d); });
  const norm = a => { const t = a.reduce((s, v) => s + v, 0); return t > 0 ? a.map(v => v / t) : null; };
  const allN = norm(all); if (!allN) return null;
  const hrs = all.map((v, k) => v > 0 ? k : -1).filter(k => k >= 0);
  return {prof: by.map((a, w) => (days[w].size >= 3 && norm(a)) || allN), own: by.map((a, w) => days[w].size >= 3), lo: Math.min(...hrs), hi: Math.max(...hrs), weeks: 8};
}
const hourLbl = hr => fmtTime(pad(hr % 24) + ':00').replace(':00', '');
function hourlyForecast(fc, metric, id, fmt, fmtShort, what) {
  const P = hourProfile(metric, id); if (!P) return '';
  const hours = Array.from({length: P.hi - P.lo + 1}, (_, k) => P.lo + k);
  const days = fc.map(f => { const w = parseD(f.d).getDay(), sh = P.prof[w]; return {d: f.d, w, vals: hours.map(hr => f.mean * sh[hr]), lo: hours.map(hr => f.lo80 * sh[hr]), hi: hours.map(hr => f.hi80 * sh[hr])}; });
  let sel = F('fc.hday'); if (!days.some(x => x.d === sel)) sel = days[0].d;
  const day = days.find(x => x.d === sel), max = Math.max(...days.flatMap(x => x.vals), 0) || 1, dmax = Math.max(...day.vals);
  const peak = day.vals.indexOf(dmax), dayName = x => parseD(x).toLocaleDateString('en-PH', {weekday: 'short', month: 'short', day: 'numeric'});
  regCsv('forecastHourly', `forecast-${metric}-by-hour`, () => days.flatMap(x => hours.map((hr, k) => ({date: x.d, weekday: parseD(x.d).toLocaleDateString('en-PH', {weekday: 'short'}), hour: `${pad(hr)}:00-${pad(hr + 1)}:00`, forecast: round(x.vals[k], 2), lo80: round(x.lo[k], 2), hi80: round(x.hi[k], 2)}))),
    [['date', 'Date'], ['weekday', 'Day'], ['hour', 'Hour'], ['forecast', 'Forecast'], ['lo80', '80% low'], ['hi80', '80% high']]);
  const chart = colChart(hours.map((hr, k) => ({x: hourLbl(hr), v: day.vals[k], hl: k === peak, tip: `${hourLbl(hr)} to ${hourLbl(hr + 1)}: ${fmt(day.vals[k])} expected (likely ${fmt(day.lo[k])} to ${fmt(day.hi[k])})`})), {fmt: fmtShort, every: hours.length > 12 ? 2 : 1});
  const heat = `<div class="tablewrap heatwrap"><table class="heat"><thead><tr><th>Day</th>${hours.map(hr => `<th>${esc(hourLbl(hr))}</th>`).join('')}<th class="r">Day total</th></tr></thead><tbody>
    ${days.map(x => `<tr class="${x.d === sel ? 'on' : ''}" data-act="fcHday" data-d="${x.d}" title="Show ${esc(dayName(x.d))} in the chart"><td><b>${esc(dayName(x.d))}</b></td>${x.vals.map((v, k) => { const a = Math.round(v / max * 100); return `<td style="background:color-mix(in srgb,var(--c1) ${Math.max(0, Math.min(88, a))}%,transparent);${a > 55 ? 'color:#fff' : ''}" data-tip="${esc(`${dayName(x.d)}, ${hourLbl(hours[k])} to ${hourLbl(hours[k] + 1)}: ${fmt(v)}`)}">${v >= max * .02 ? esc(fmtShort(v)) : ''}</td>`; }).join('')}<td class="r"><b>${esc(fmtShort(x.vals.reduce((s, v) => s + v, 0)))}</b></td></tr>`).join('')}
  </tbody></table></div>`;
  return `<div class="card"><h3>Hour by hour<span class="actions">${csvBtn('forecastHourly', 'CSV')}</span></h3>
    <p class="cap">Each forecast day’s ${esc(what)}, spread across the day the way that weekday went over the last ${P.weeks} weeks.${metric === 'ingredient' ? ' Ingredient use follows when orders come in.' : ''} Pick a day, or tap a row below.</p>
    <div class="fc-controls" style="margin-bottom:10px"><label>Day<select data-f="fc.hday">${opts(days.map(x => [x.d, dayName(x.d)]), sel)}</select></label>
      <span class="hint">Busiest hour: <b>${esc(hourLbl(hours[peak]))} to ${esc(hourLbl(hours[peak] + 1))}</b>, about ${esc(fmt(dmax))}${P.own[day.w] ? '' : ` (few past ${esc(parseD(sel).toLocaleDateString('en-PH', {weekday: 'long'}))}s, so this uses every day’s pattern)`}</span></div>
    ${chart}
    <h4 style="margin:18px 0 8px">Every forecast day</h4>${heat}</div>`;
}

/* ---------- tabs with a moving indicator ---------- */
function placeTabInds() {
  const fx = document.body.classList.contains('fx');
  $$('.tabs[data-g]').forEach(tb => {
    const on = tb.querySelector('button.on'), ind = tb.querySelector('.ind'); if (!on || !ind) return;
    const g = tb.dataset.g, x = on.offsetLeft, w = on.offsetWidth, prev = (S.tabPos || {})[g];

    ind.style.transform = `translateX(${fx && prev ? prev.x : x}px)`; ind.style.width = (fx && prev ? prev.w : w) + 'px';

VIEWS.history = () => {
  const mod = F('h.mod'), act = F('h.act'), from = F('h.from'), to = F('h.to'), qq = F('h.q').trim();
  const w = [], p = [];
  const by = F('h.by');
  if (mod) { w.push('module=?'); p.push(mod); } if (act) { w.push('action=?'); p.push(act); }
  if (by) { if (by === '-') w.push(`COALESCE(by_email, by_name, '') = ''`); else { w.push('(by_email=? OR (by_email IS NULL AND by_name=?))'); p.push(by, by); } }
  if (from) { w.push('substr(ts,1,10)>=?'); p.push(from); } if (to) { w.push('substr(ts,1,10)<=?'); p.push(to); }
  if (qq) { w.push('(summary LIKE ? OR before LIKE ? OR after LIKE ? OR details LIKE ?)'); p.push(...Array(4).fill(`%${qq}%`)); }
  const where = w.length ? 'WHERE ' + w.join(' AND ') : '';
  const total = val(`SELECT COUNT(*) FROM audit ${where}`, p), PER = 100, pages = Math.max(1, Math.ceil(total / PER));
  const page = Math.min(+F('h.page', 0), pages - 1);

  const whoL = q(`SELECT COALESCE(by_email, by_name) k, MAX(by_name) n, MAX(by_email) e FROM audit WHERE COALESCE(by_email, by_name, '') <> '' GROUP BY k ORDER BY n`).map(x => [x.k, x.n && x.e ? `${x.n} (${x.e})` : x.n || x.e]);
  if (q(`SELECT 1 FROM audit WHERE COALESCE(by_email, by_name, '') = '' LIMIT 1`).length) whoL.push(['-', cloudOn() ? 'Not recorded (older entries)' : 'This file (no login)']);
  const mods = q('SELECT DISTINCT module m FROM audit ORDER BY m').map(r => r.m);
  const actsL = q(`SELECT DISTINCT action a FROM audit ${mod ? 'WHERE module=?' : ''} ORDER BY a`, mod ? [mod] : []).map(r => r.a);
  const open = S.f['h.open'] || {};
  regCsv('history', 'history', () => q(`SELECT * FROM audit ${where} ORDER BY ts, id`, p), [['id', 'Entry'], ['ts', 'Time'], ['by_name', 'By'], ['by_email', 'Account'], ['module', 'Area'], ['action', 'Change'], ['summary', 'What happened'], ['before', 'Before'], ['after', 'After'], ['details', 'Details']]);
  const pager = total > PER ? `<div class="pager"><button class="btn sm" data-act="hPage" data-n="-1" ${page ? '' : 'disabled'}>${ic('left')}Newer</button><span class="small muted">${(page * PER + 1).toLocaleString('en-PH')}–${Math.min(total, (page + 1) * PER).toLocaleString('en-PH')} of ${total.toLocaleString('en-PH')}</span><button class="btn sm" data-act="hPage" data-n="1" ${page < pages - 1 ? '' : 'disabled'}>Older${ic('right')}</button></div>` : '';
  return head('History', `${total.toLocaleString('en-PH')} change${total === 1 ? '' : 's'} match.`, csvBtn('history'), 'history') + `
  <div class="bar-row">${whoL.length ? fSelect('h.by', 'Person', [['', 'Everyone'], ...whoL]) : ''}${fSelect('h.mod', 'Area', [['', 'Everything'], ...mods])}${fSelect('h.act', 'Change type', [['', 'All changes'], ...actsL])}${fInput('h.from', 'From', 'date')}${fInput('h.to', 'To', 'date')}
  ${search('h.q', 'Name, item, amount…')}${w.length ? '<button class="btn sm ghost" data-act="hClear">Clear filters</button>' : ''}</div>
  ${pager}
  ${T([{h: 'What happened', main: 1, f: r => `${chip(r.module)} <b>${esc(r.action)}</b> <span class="muted small">${esc(prettyTs(r.ts))} · ${whoTag(r)}</span><div style="margin-top:3px">${esc(r.summary)}</div>${open[r.id] ? historyDetail(r) : `<span class="small" style="color:var(--link)">Show details</span>`}`}],
    rows, {row: r => `class="click" data-act="hToggle" data-id="${r.id}"`, cls: 'hist', empty: empty('Nothing matches', 'Try a wider date range or clear the filters.')})}
  ${pager ? `<div style="margin-top:12px">${pager}</div>` : ''}`;

/* ---------- in-app confirmation dialog (replaces the browser's confirm box) ---------- */
function ask({title, body = '', ok = 'Continue', cancel = 'Cancel', danger = false}) {
  return new Promise(res => {
    const d = $('#ask');
    d.innerHTML = `<div class="mform"><header><h2>${esc(title)}</h2></header>${body ? `<div class="mbody"><p style="margin:0">${body}</p></div>` : ''}
      <footer><button type="button" class="btn ghost" data-ask="0">${esc(cancel)}</button><button type="button" class="btn ${danger ? 'danger' : 'primary'}" data-ask="1">${esc(ok)}</button></footer></div>`;
    let settled = false;
    const done = v => { if (settled) return; settled = true; d.close(); res(v); };
    d.onclick = e => { const b = e.target.closest('[data-ask]'); if (b) { e.stopPropagation(); done(b.dataset.ask === '1'); } };
    d.oncancel = e => { e.preventDefault(); done(false); };
    d.showModal();
    d.querySelector(`[data-ask="${danger ? 0 : 1}"]`).focus();
  });
}

    }});

/* ---------- import ingredients from a CSV ---------- */
function parseCsv(text) {
  const rows = []; let row = [], cur = '', inQ = false;
  text = text.replace(/^﻿/, '');
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (inQ) { if (ch === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else inQ = false; } else cur += ch; }
    else if (ch === '"') inQ = true;
    else if (ch === ',') { row.push(cur); cur = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cur); rows.push(row); row = []; cur = ''; }
    else cur += ch;
  }
  if (cur || row.length) { row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(c => c.trim() !== ''));
}
const IMPORT_COLS = [['name', 'Ingredient'], ['unit', 'Unit'], ['category', 'Category'], ['reorder_level', 'Reorder at'], ['unit_cost', 'Cost per unit'], ['on_hand', 'On hand']];
function importTemplate() {
  download(new Blob([csvText([{name: 'Fresh milk', unit: 'ml', category: 'Dairy', reorder_level: 2000, unit_cost: 0.11, on_hand: 12000}, {name: 'Espresso beans', unit: 'g', category: 'Coffee', reorder_level: 500, unit_cost: 1.6, on_hand: 3000}], IMPORT_COLS)], {type: 'text/csv'}), 'lebean-ingredients-template.csv');
}
async function importIngredients(file) {
  const rows = parseCsv(await file.text());
  if (rows.length < 2) { toast('That file has no rows to import.', 'warn'); return; }
  const head0 = rows[0].map(h => h.trim().toLowerCase());
  const idx = k => { const alias = {name: ['ingredient', 'name', 'item'], unit: ['unit', 'uom'], category: ['category', 'group'], reorder_level: ['reorder at', 'reorder', 'reorder level', 'par'], unit_cost: ['cost per unit', 'unit cost', 'cost'], on_hand: ['on hand', 'stock', 'quantity', 'qty']}[k]; return head0.findIndex(h => alias.includes(h)); };
  const ix = Object.fromEntries(IMPORT_COLS.map(([k]) => [k, idx(k)]));
  if (ix.name < 0 || ix.unit < 0) { toast('The file needs at least “Ingredient” and “Unit” columns. Download the template to see the format.', 'err'); return; }
  const existing = Object.fromEntries(ingredients(true).map(i => [i.name.toLowerCase(), i]));
  const items = rows.slice(1).map(r => { const g = k => ix[k] >= 0 ? (r[ix[k]] || '').trim() : ''; const name = g('name'), ex = existing[name.toLowerCase()];
    return {name, unit: g('unit'), category: g('category'), reorder_level: num(g('reorder_level')), unit_cost: num(g('unit_cost')), on_hand: g('on_hand') === '' ? null : num(g('on_hand')), status: !name || !g('unit') ? 'skip' : ex ? 'update' : 'new', ex}; });
  const nNew = items.filter(x => x.status === 'new').length, nUpd = items.filter(x => x.status === 'update').length;
  modal({title: `Import ${items.length} ingredient row${items.length === 1 ? '' : 's'}`, submit: `Import ${nNew + nUpd}`, wide: true,
    body: `<p style="margin:0">${nNew} new, ${nUpd} already in the app (their reorder level, cost and category will be updated; stock isn’t changed), ${items.length - nNew - nUpd} skipped for a missing name or unit.</p>
      ${T([{h: 'Ingredient', main: 1, f: x => `<b>${esc(x.name || '(no name)')}</b> ${chip(x.status === 'new' ? 'New' : x.status === 'update' ? 'Update' : 'Skip', x.status === 'new' ? 'ok' : x.status === 'update' ? 'info' : 'bad')}`}, {h: 'Unit', k: 'unit'}, {h: 'Category', k: 'category'}, {h: 'Reorder at', r: 1, f: x => fq(x.reorder_level)}, {h: 'Cost', r: 1, f: x => x.unit_cost ? peso(x.unit_cost) : ''}, {h: 'Opening stock', r: 1, f: x => x.status === 'new' && x.on_hand != null ? fq(x.on_hand) : ''}], items.slice(0, 200))}`,
    onSubmit: () => {
      need(nNew + nUpd, 'There’s nothing to import.');
      const ts = nowTs();
      withNote('Imported from CSV', () => tx(() => items.forEach(x => {
        if (x.status === 'new') { const row = {name: x.name, unit: x.unit, category: x.category, reorder_level: x.reorder_level, unit_cost: x.unit_cost, active: 1, created_at: ts}; const id = insert('ingredients', row); audit('Inventory', 'Added ingredient', id, `Imported ${x.name} (${x.unit})`, null, row); if (x.on_hand) insert('stock_moves', {ts, ingredient_id: id, qty: x.on_hand, unit_cost: x.unit_cost, type: 'opening', note: 'Opening stock (import)'}); }
        else if (x.status === 'update') { const after = {category: x.category || x.ex.category, reorder_level: x.reorder_level, unit_cost: x.unit_cost || x.ex.unit_cost}; const before = {category: x.ex.category, reorder_level: x.ex.reorder_level, unit_cost: x.ex.unit_cost}; if (JSON.stringify(after) !== JSON.stringify(before)) { update('ingredients', x.ex.id, after); audit('Inventory', 'Edited ingredient', x.ex.id, `${x.ex.name}: updated from import`, before, after); } }
      })));
      toast(`Imported ${nNew} new and updated ${nUpd}.`);
    }});
}

/* sample expenses for the sample data set */
function sampleExpenses(start, t, audits) {
  let seed = 7741; const rnd = () => (seed = (seed * 1664525 + 1013904223) % 4294967296) / 4294967296;
  const rows = [], add = (date, category, description, amount, payment, note = '', dir = 'out', details = null) => {
    if (date < start || date > t) return;
    rows.push({date, direction: dir, category, description, amount: round(amount), payment, note, details, recurring_id: null, status: 'active', void_reason: null, created_at: date + ' 18:30:00', updated_at: null});
  };
  const rate = 30;
  for (let m = start.slice(0, 7); m <= t.slice(0, 7);) {
    const mn = parseD(m + '-01').toLocaleDateString('en-PH', {month: 'long'});
    add(`${m}-05`, 'Rent', `${mn} rent`, 15000, 'Bank transfer', 'Kitchen space');
    add(`${m}-12`, 'Internet and phone', `${mn} internet`, 1699, 'GCash');
    add(`${m}-15`, 'Marketing', 'Boosted posts', 1200 + Math.round(rnd() * 6) * 100, 'GCash');
    add(`${m}-20`, 'Utilities', `${mn} electricity`, 4800 + Math.round(rnd() * 1600), 'GCash');
    add(`${m}-20`, 'Utilities', `${mn} water`, 520 + Math.round(rnd() * 260), 'Cash');
    const d = parseD(m + '-01'); d.setMonth(d.getMonth() + 1); m = dstr(d).slice(0, 7);
  }
  for (const d of dateRange(start, t)) if (parseD(d).getDay() === 1) add(d, 'Packaging and supplies', 'Tissue, bags, cleaning supplies', 650 + Math.round(rnd() * 500), 'Cash');
  [12, 26, 41, 55].map(k => addDays(start, k)).forEach((d, k) => { add(d, 'Event fees', 'Weekend market booth', 1500, 'Cash'); if (k === 1) add(addDays(d, -9), 'Event deposit', 'Deposit for office coffee cart', 5000, 'Bank transfer', '', 'in'); });
  add(addDays(start, 18), 'Equipment', 'Milk frother and pitchers', 3450, 'GCash');
  add(addDays(start, 38), 'Repairs and maintenance', 'Grinder burr replacement', 2200, 'Cash');
  // GrabFood commission for each finished half-month
  for (let d = start; d <= t;) {
    const day = +d.slice(8), ym = d.slice(0, 7), s = day <= 15 ? ym + '-01' : ym + '-16', e = day <= 15 ? ym + '-15' : `${ym}-${daysInMonth(d)}`;
    if (e < t) {
      const f = s < start ? start : s, x = one(`SELECT COUNT(*) n, COALESCE(SUM(total),0) s FROM orders WHERE status='completed' AND channel='GrabFood' AND substr(ts,1,10) BETWEEN ? AND ?`, [f, e]);
      if (x.s) add(e, 'GrabFood commission', `GrabFood commission, ${shortDate(f)} to ${shortDate(e)}`, x.s * rate / 100, 'Deducted from GrabFood payout', '', 'out', JSON.stringify({from: f, to: e, channel: 'GrabFood', rate, sales: round(x.s), orders: x.n}));
    }
    d = addDays(e, 1);
  }
  rows.sort((a, b) => a.date < b.date ? -1 : 1);
  insertMany('expenses', rows);
  rows.forEach(r => audits.push({ts: r.created_at, module: 'Cashflow', action: r.direction === 'in' ? 'Money in' : 'Expense added', entity_id: null, summary: `${r.direction === 'in' ? 'Money in' : 'Expense'}: ${r.description} ${peso(r.amount)} (${r.category})`, before: null, after: null, details: null}));
  const ym = t.slice(0, 7), pm = (() => { const d = parseD(ym + '-01'); d.setMonth(d.getMonth() - 1); return dstr(d).slice(0, 7); })();
  [['Rent', 'Shop rent', 15000, 5, 'Bank transfer'], ['Internet and phone', 'Internet', 1699, 12, 'GCash']].forEach(([category, description, amount, day, payment]) => {
    const rid = insert('recurring_expenses', {direction: 'out', category, description, amount, payment, day, active: 1, last_posted: +t.slice(8) >= day ? ym : pm, created_at: start + ' 09:00:00'});
    run(`UPDATE expenses SET recurring_id=? WHERE category=? AND amount=? AND recurring_id IS NULL`, [rid, category, amount]);
  });
}

/* ---------- recipe import (CSV, one row per ingredient line) ---------- */
const RIMP_COLS = [['item', 'Item'], ['category', 'Category'], ['price', 'Price'], ['ingredient', 'Ingredient'], ['qty', 'Qty per serving'], ['unit', 'Unit']];
function recipeTemplate() {
  const ingMap = ingIndex(), prods = products();
  const rows = prods.length && can('backup') ? prods.flatMap(p => (p.lines.length ? p.lines : [{}]).map((l, k) => ({item: p.name, category: k ? '' : p.category || '', price: k ? '' : p.price, ingredient: l.ingredient_id ? (ingMap[l.ingredient_id] || l).name : '', qty: l.qty ?? '', unit: l.ingredient_id ? (ingMap[l.ingredient_id] || l).unit : ''})))
    : [{item: 'Spanish Latte', category: 'Iced coffee', price: 150, ingredient: 'Espresso beans', qty: 18, unit: 'g'}, {item: 'Spanish Latte', ingredient: 'Fresh milk', qty: 200, unit: 'ml'}, {item: 'Spanish Latte', ingredient: 'Condensed milk', qty: 30, unit: 'ml'}];
  download(new Blob([csvText(rows, RIMP_COLS)], {type: 'text/csv'}), prods.length && can('backup') ? `lebean-recipes-${today()}.csv` : 'lebean-recipes-template.csv');
}
async function importRecipes(file) {
  const rows = parseCsv(await file.text());
  if (rows.length < 2) { toast('That file has no rows to import.', 'warn'); return; }
  const head0 = rows[0].map(h => h.trim().toLowerCase());
  const alias = {item: ['item', 'menu item', 'product', 'recipe', 'name'], category: ['category', 'group'], price: ['price', 'selling price', 'srp'], ingredient: ['ingredient'], qty: ['qty per serving', 'qty', 'quantity', 'amount', 'per serving'], unit: ['unit', 'uom']};
  const ix = Object.fromEntries(Object.keys(alias).map(k => [k, head0.findIndex(h => alias[k].includes(h))]));
  if (ix.item < 0 || ix.ingredient < 0 || ix.qty < 0) { toast('The file needs “Item”, “Ingredient” and “Qty per serving” columns. Download the template to see the format.', 'err'); return; }
  const ingByName = Object.fromEntries(ingredients(true).map(i => [i.name.toLowerCase(), i]));
  const prodByName = Object.fromEntries(products(true).map(p => [p.name.toLowerCase(), p]));
  const groups = new Map();
  rows.slice(1).forEach(r => {
    const g = k => ix[k] >= 0 ? (r[ix[k]] || '').trim() : '';
    const name = g('item'); if (!name) return;
    const key = name.toLowerCase(), x = groups.get(key) || {name, category: '', price: '', lines: [], problems: []};
    if (g('category') && !x.category) x.category = g('category');
    if (g('price') !== '' && x.price === '') x.price = g('price');
    const iname = g('ingredient');
    if (iname) {
      const ing = ingByName[iname.toLowerCase()], qty = num(g('qty'));
      if (!ing) x.problems.push(`unknown ingredient “${iname}”`);
      else if (!(qty > 0)) x.problems.push(`no quantity for ${ing.name}`);
      else if (g('unit') && g('unit').toLowerCase() !== ing.unit.toLowerCase()) x.problems.push(`${ing.name} is counted in ${ing.unit}, not ${g('unit')}`);
      else if (x.lines.some(l => l.ingredient_id === ing.id)) x.problems.push(`${ing.name} is listed twice`);
      else x.lines.push({ingredient_id: ing.id, name: ing.name, unit: ing.unit, qty});
    }
    groups.set(key, x);
  });
  const items = [...groups.values()].map(x => {
    const ex = prodByName[x.name.toLowerCase()];
    const price = x.price === '' ? (ex ? ex.price : NaN) : num(x.price);
    if (!(price >= 0) || Number.isNaN(price)) x.problems.push('no price');
    if (!x.lines.length && !x.problems.length) x.problems.push('no ingredients');
    const same = ex && price === ex.price && JSON.stringify(x.lines.map(l => [l.ingredient_id, l.qty]).sort()) === JSON.stringify(ex.lines.map(l => [l.ingredient_id, l.qty]).sort());
    const catChange = ex && x.category && x.category !== (ex.category || '');
    return {...x, ex, price, status: x.problems.length ? 'error' : !ex ? 'new' : same ? (catChange ? 'details' : 'same') : 'version'};
  });
  const n = k => items.filter(x => x.status === k).length;
  const todo = items.filter(x => ['new', 'version', 'details'].includes(x.status));
  const ST = {new: ['New', 'ok'], version: ['New version', 'info'], details: ['Category only', 'info'], same: ['No change', ''], error: ['Skipped', 'bad']};
  modal({title: `Import ${items.length} recipe${items.length === 1 ? '' : 's'}`, submit: todo.length ? `Import ${todo.length}` : undefined, wide: true,
    body: `<p style="margin:0">${n('new')} new, ${n('version')} changed (saved as a new version; past orders keep the old one), ${n('same')} unchanged${n('details') ? `, ${n('details')} with only a new category` : ''}${n('error') ? `, <b>${n('error')} skipped</b>` : ''}.</p>
      ${n('error') ? '<p class="hint" style="margin:0">Ingredients must already exist in Inventory with the same name. Add them there (or import them) first.</p>' : ''}
      ${T([{h: 'Item', main: 1, f: x => `<b>${esc(x.name)}</b> ${chip(ST[x.status][0], ST[x.status][1])}${x.problems.length ? `<div class="small minus">${esc(x.problems.join('; '))}</div>` : ''}`},
        {h: 'Price', r: 1, f: x => Number.isNaN(x.price) ? '' : `${peso(x.price)}${x.ex && x.ex.price !== x.price ? `<div class="small muted">was ${peso(x.ex.price)}</div>` : ''}`},
        {h: 'Per serving', f: x => `<span class="small">${x.lines.map(l => `${fq(l.qty)} ${esc(l.unit)} ${esc(l.name)}`).join(', ')}</span>`}], items)}
      <label class="f">Note for new versions <small>Saved as “What changed”</small><input name="note" value="Imported from CSV"></label>`,
    onSubmit: d => {
      need(todo.length, 'There’s nothing to import.');
      const ts = nowTs(), note = (d.note || '').trim() || 'Imported from CSV';
      tx(() => todo.forEach(x => {
        if (x.status === 'new') {
          const pid = insert('products', {name: x.name, category: x.category, active: 1, created_at: ts});
          const vid = insert('recipe_versions', {product_id: pid, version: 1, price: x.price, lines: JSON.stringify(x.lines), note, created_at: ts});
          update('products', pid, {current_version: vid});
          audit('Recipes', 'Added recipe', pid, `Imported ${x.name} at ${peso(x.price)} (v1)`, null, {name: x.name, category: x.category, price: x.price, lines: x.lines});
          return;
        }
        if (x.status === 'version') {
          const vid = insert('recipe_versions', {product_id: x.ex.id, version: x.ex.version + 1, price: x.price, lines: JSON.stringify(x.lines), note, created_at: ts});
          update('products', x.ex.id, {current_version: vid});
          audit('Recipes', 'New version', x.ex.id, `${x.ex.name}: version ${x.ex.version + 1} (${note})`, {version: x.ex.version, price: x.ex.price, lines: x.ex.lines}, {version: x.ex.version + 1, price: x.price, lines: x.lines});
        }
        if (x.category && x.category !== (x.ex.category || '')) { update('products', x.ex.id, {category: x.category}); audit('Recipes', 'Edited recipe', x.ex.id, `${x.ex.name}: category changed`, {category: x.ex.category || ''}, {category: x.category}); }
      }));
      toast(`Imported ${n('new')} new and updated ${n('version') + n('details')} recipe${n('version') + n('details') === 1 ? '' : 's'}.`);
    }});
}

  const br = /Edg\//.test(ua) ? 'Edge' : /OPR\//.test(ua) ? 'Opera' : /Chrome\//.test(ua) ? 'Chrome' : /Firefox\//.test(ua) ? 'Firefox' : /Safari\//.test(ua) ? 'Safari' : '';
  return br ? `${os}, ${br}` : os;
}
function ago(t) {
  if (!t) return 'never';
  const d = typeof t === 'string' && !/[TZ+]/.test(t.slice(10)) ? new Date(t.replace(' ', 'T')) : new Date(t);
  const s = (Date.now() - d.getTime()) / 1000;
  if (s < 60) return 'just now'; if (s < 3600) return `${Math.floor(s / 60)} min ago`; if (s < 86400) return `${Math.floor(s / 3600)} hr ago`;
  if (s < 86400 * 7) return `${Math.floor(s / 86400)} day${s < 172800 ? '' : 's'} ago`;
  return d.toLocaleDateString('en-PH', {month: 'short', day: 'numeric', year: d.getFullYear() === new Date().getFullYear() ? undefined : 'numeric'});
}

  if (!force && S.activity && S.activity.from === from && Date.now() - S.activity.at < 60000) return;
  if (S.actLoading) return; S.actLoading = true;
  try {
    const [users, opens] = await Promise.all([rpc('lb_activity', {p_from: from}), rpc('lb_opens_recent', {p_limit: 300})]);
    S.activity = {at: Date.now(), from, users, opens, err: null};

  S.actLoading = false;
  if (S.view === 'team') renderView();
}

  hToggle: d => { const o = S.f['h.open'] ||= {}; o[d.id] = !o[d.id]; renderView(); },
  hClear: () => { ['h.by', 'h.mod', 'h.act', 'h.from', 'h.to', 'h.q', 'h.page'].forEach(k => delete S.f[k]); renderView(); },
  exportDb: () => download(new Blob([db.export()], {type: 'application/x-sqlite3'}), `lebean-backup-${today()}.db`),

};

/* chart tooltips: hover on desktop, tap on touch */
(() => {
  const tip = $('#tip'); let cur = null;
  const show = (el, x, y) => { tip.textContent = el.dataset.tip; tip.classList.add('on'); const w = tip.offsetWidth, h = tip.offsetHeight; tip.style.left = Math.min(innerWidth - w - 8, Math.max(8, x - w / 2)) + 'px'; tip.style.top = Math.max(8, y - h - 12) + 'px'; cur = el; };
  const hide = () => { tip.classList.remove('on'); cur = null; };
  document.addEventListener('mousemove', e => { const el = e.target.closest('[data-tip]'); if (el) show(el, e.clientX, e.clientY); else if (cur) hide(); });
  document.addEventListener('touchstart', e => { const el = e.target.closest('[data-tip]'); if (el) { const t = e.touches[0]; show(el, t.clientX, t.clientY); } else hide(); }, {passive: true});
  addEventListener('scroll', hide, {passive: true});
})();

/* ---------- start ---------- */
async function loadEngine() {
  const injectJs = text => { const sc = document.createElement('script'); sc.textContent = text; document.head.appendChild(sc); };
  if (typeof window.initSqlJs === 'function') {
    S.offlineReady = true;
    const w = ($('#lebean-wasm') ? $('#lebean-wasm').textContent : '').trim();
    return w ? {wasmBinary: fromB64(w)} : {};
  }
  // WebAssembly build: several times faster than the pure-JS build
  if (typeof WebAssembly === 'object') for (const [js, wasm] of ENGINE_WASM) {
    try {
      const [r1, r2] = await Promise.all([fetch(js), fetch(wasm)]); if (!r1.ok || !r2.ok) continue;
      const text = await r1.text(), bin = new Uint8Array(await r2.arrayBuffer());
      if (!text.includes('initSqlJs') || bin.length < 10000) continue;
      injectJs(text);
      if (typeof window.initSqlJs === 'function') { S.libText = text; if (BUILD !== 'online') S.wasmB64 = toB64(bin); return {wasmBinary: bin}; }
    } catch {}
  }
  for (const url of ENGINE_URLS) {
    try {
      const r = await fetch(url); if (!r.ok) continue;
      const text = await r.text(); if (!text.includes('initSqlJs')) continue;
      injectJs(text);
      if (typeof window.initSqlJs === 'function') { S.libText = text; return {}; }
    } catch {}
  }
  throw new Error('engine');
}
/* ---------- one window at a time ---------- */
function holdLock(key) {
  return new Promise(res => {
    const fallback = () => {
      let bc; try { bc = new BroadcastChannel('lebean-lock:' + key); } catch { return res(true); }
      let taken = false;
      bc.onmessage = ev => { if (ev.data === 'who' && S.lockHeld) bc.postMessage('here'); else if (ev.data === 'here' && !S.lockHeld) taken = true; };
      bc.postMessage('who');
      setTimeout(() => { if (taken) { bc.close(); res(false); } else { S.lockHeld = true; S.lockBc = bc; res(true); } }, 450);
    };
    if (!(navigator.locks && navigator.locks.request)) return fallback();
    try {
      navigator.locks.request('lebean:' + key, {ifAvailable: true}, lock => {
        if (!lock) { res(false); return; }
        S.lockHeld = true; res(true);
        return new Promise(() => {}); // held until this window closes
      }).catch(fallback);
    } catch { fallback(); }
  });
}
function showBlocked() {
  $('#app').innerHTML = `<div class="fatal blocked"><img src="${isDark() ? LOGO_CREAM : LOGO_BROWN}" alt="Le Bean"><h1>Already open in another window</h1>
    <p>Le Bean Manager can only be open in one tab or window at a time, so changes can’t overwrite each other.</p>
    <p>Go back to the window that’s already open, or close the other windows and then check again.</p>
    ${SELF ? `<div class="pathbox">${ic('book')}<span>${esc(SELF.path)}</span></div>` : ''}
    <div class="actions" style="margin-top:18px"><button class="btn primary" data-act="recheck">Check again</button></div></div>`;
}
async function boot() {
  const cc = readCloudCfg();
  if (cc) { cloudBoot(cc); return; }
  if (BUILD === 'online') { applyPrefs(); $('#app').innerHTML = `<div class="fatal"><img src="${LOGO_BROWN}" alt="Le Bean"><h1>No online shop set</h1><p>This copy of the online app is missing its Supabase project details. Download it again.</p></div>`; return; }
  applyPrefs();
  if (SELF && !(await holdLock('path:' + SELF.path))) { showBlocked(); return; }
  try { const cfg = await loadEngine(); SQL = await window.initSqlJs(cfg); }
  catch {
    $('#app').innerHTML = `<div class="fatal"><img src="${LOGO_BROWN}" alt="Le Bean"><h1>Connect to the internet once</h1><p>This copy doesn’t have its database engine saved inside yet, so it needs to download it (about 1.5 MB) the first time it opens.</p><p>Connect and reload. After you turn on autosave (or download an updated copy), the file opens offline.</p><button class="btn primary" onclick="location.reload()">Reload</button></div>`;
    return;
  }
  const b64 = ($('#lebean-db').textContent || '').trim();
  S.loadedB64 = b64;
  try { db = b64 ? new SQL.Database(fromB64(b64)) : new SQL.Database(); }
  catch { $('#app').innerHTML = `<div class="fatal"><img src="${LOGO_BROWN}" alt="Le Bean"><h1>This file’s data is damaged</h1><p>The database inside this .html couldn’t be read. Open a backup copy or a .db export instead.</p></div>`; return; }
  const before = +(getMetaSafe('schema_version') || 0);
  const fresh = migrate();
  S.appId = getMeta('app_id');
  if (fresh || before < SCHEMA_VERSION) { S.dirty = true; S.ver++; }
  if (!SELF && !(await holdLock('app:' + S.appId))) { showBlocked(); return; }
  try { const d = await idb(); d.transaction('kv', 'readwrite').objectStore('kv').clear(); } catch {} // forget files remembered by older versions
  renderShell(); applyPrefs(); render();
  if (fresh && !b64) S.afterGate = welcome;
  setTimeout(() => gate(), 200);
}
function getMetaSafe(k) { try { return getMeta(k); } catch { return null; } }
boot();
